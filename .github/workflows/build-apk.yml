name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create Web App Bundle
        run: |
          mkdir -p dist
          cp index.html style.css app.js manifest.json sw.js dist/ 2>/dev/null || true

      - name: Install Nativefier / PWA Builder CLI
        run: |
          npm install -g pwa-builder-cli 2>/dev/null || true

      - name: Package web app as APK via Bubblewrap
        run: |
          npx @bubblewrap/cli init --manifest=manifest.json --directory=android-app --skipValidation || true
          
